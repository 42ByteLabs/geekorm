name: Bug Report
description: Report a reproducible problem with GeekORM
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - GeekMasher
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for someone else to reproduce the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      description: Please confirm these before submitting.
      options:
        - label: I have searched existing issues and discussions for duplicates.
          required: true
        - label: I have tested with the latest released version or current main branch where possible.
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of GeekORM appears to be affected?
      multiple: true
      options:
        - Core library
        - Derive macros
        - CLI
        - Migrations
        - SQL Query Builder
        - Documentation
        - Other / unsure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GeekORM version
      description: Include the crate version, git commit, or branch you are using.
      placeholder: "v0.11.0, main@abc1234, or path dependency"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Describe the problem in one or two paragraphs.
      placeholder: "When I run ..., GeekORM ..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps, commands, schema definitions, or code needed to reproduce the bug.
      placeholder: |
        1. Define this model: ...
        2. Run this command: ...
        3. Execute this query: ...
        4. Observe: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
      placeholder: "I expected GeekORM to ..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include exact error messages where possible.
      placeholder: "Instead, GeekORM ..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include details that may affect reproduction.
      value: |
        - OS:
        - Rust version (`rustc --version`):
        - Cargo version (`cargo --version`):
        - Database/backend:
        - Relevant features enabled:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack traces, or generated SQL
      description: Paste any relevant logs, compiler output, panic trace, or generated SQL. This will be formatted as code.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add links, screenshots, workaround notes, or anything else that may help.
