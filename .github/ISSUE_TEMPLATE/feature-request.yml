name: Feature Request
description: Suggest an improvement or new capability for GeekORM
title: "[Feat]: "
labels: ["feature", "enhancement", "triage"]
assignees:
  - GeekMasher
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the use case and the outcome you want, not just a proposed implementation.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      description: Please confirm these before submitting.
      options:
        - label: I have searched existing issues and discussions for similar requests.
          required: true
        - label: I have checked the documentation to confirm this is not already supported.
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Target component
      description: Which part of GeekORM would this change affect?
      multiple: true
      options:
        - Core library
        - Derive macros
        - CLI
        - Migrations
        - SQL Query Builder
        - Documentation
        - Developer experience
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what currently makes it hard or impossible?
      placeholder: "I want to ..., but currently ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, command, or documentation change you would like to see.
      placeholder: "GeekORM could support this by ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs have you considered?
      placeholder: "I tried ..., but ..."

  - type: textarea
    id: example
    attributes:
      label: Example API or usage
      description: If relevant, show what the ideal code, CLI command, schema, or generated SQL might look like.
      render: rust

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add links to related projects, prior art, screenshots, or anything else that may help.
